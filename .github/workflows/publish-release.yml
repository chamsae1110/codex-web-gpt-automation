name: publish-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release metadata and annotated tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = "tag"
          python scripts/check_docs.py --root .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it unchanged."
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .draft)" = "false"
